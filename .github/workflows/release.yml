# Release: push a tag like v0.1.0.
#   1. release  : creates one draft GitHub release for the tag (all builds upload into it; parallel jobs
#                 creating their own drafts made v0.2.0's macOS files land in a second draft)
#   2. desktop  : macOS (universal, Developer ID signed + notarized), Windows and Linux builds
#   3. publish  : moves files from any duplicate drafts of the tag into the release, then un-drafts it
#   Manual run with "publish_only" just repeats step 3 (to repair a release).
# npm packages are published by npm.yml (on the tag push, or called from here on a manual run).
# Manual run (Actions → Release → Run workflow, e.g. from the GitHub app): creates the tag on main first.
#
# Secrets (distributed from kajisho5/runway by its sync-secrets workflow; see runway's README):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, APPLE_TEAM_ID  App Store Connect API key (notarization)
#   MATCH_GIT_TOKEN                                               reads the shared Developer ID certificate in <owner>/hanger
#   SIGNING_KEY_PASSWORD (optional)                               passphrase of the certificate's private key
# Without the Apple secrets the macOS app is built unsigned.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, e.g. v0.1.0 (created on main if it doesn't exist yet)
        required: true
      publish_only:
        description: Only merge duplicate drafts and publish (no builds, no npm)
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Manual runs create the tag on main (a tag pushed with GITHUB_TOKEN doesn't start other workflows,
  # so this workflow also calls npm.yml itself in that case).
  tag:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create the tag if needed
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::Tag must look like v1.2.3"; exit 1 ;; esac
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then echo "$TAG already exists"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "fresnel ${TAG#v}"
          git push origin "refs/tags/$TAG"

  npm:
    needs: tag
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_only
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ github.event.inputs.tag }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  release:
    needs: tag
    if: ${{ !cancelled() && !inputs.publish_only && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create (or reuse) the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")] | sort_by(.id) | .[0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="fresnel $TAG" -F draft=true \
              -f body="Desktop apps for macOS (universal, signed and notarized), Windows and Linux. See the assets below.

          - Web app: https://kajisho5.github.io/fresnel/
          - CLI: \`npx fresnel-icon --help\`
          - MCP server: \`npx -y fresnel-mcp --root ~/Icons\`
          - What's new: https://github.com/kajisho5/fresnel/blob/main/CHANGELOG.md" --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Release id: $id"

  desktop:
    needs: [tag, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile

      # Developer ID certificate from hanger (same one runway's mac-notarize uses) + API key for notarytool.
      - name: Prepare macOS signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          HANGER_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$HANGER_TOKEN" ] || [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::warning::Apple signing secrets are missing: building an unsigned macOS app. Add this repo to kajisho5/runway's repos.txt."
            exit 0
          fi
          dir="$RUNNER_TEMP/sign"; mkdir -p "$dir/keys"
          # .p8 (PEM or base64) for notarization
          python3 - "$dir/keys/AuthKey_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8" <<'PY'
          import base64, os, sys
          raw = os.environ["ASC_KEY_P8_BASE64"]
          pem = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode("".join(raw.split())).decode()
          open(sys.argv[1], "w").write(pem.replace("\r\n", "\n").strip() + "\n")
          PY
          chmod 600 "$dir"/keys/*.p8
          # shared Developer ID Application certificate
          owner="${GITHUB_REPOSITORY%%/*}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HANGER_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c http.extraheader="$auth" clone --quiet --depth 1 "https://github.com/$owner/hanger.git" "$dir/hanger"
          src="$dir/hanger/signing"
          [ -f "$src/developer_id_application.cer" ] && [ -f "$src/devid.key.enc" ] || {
            echo "::error::No Developer ID certificate in $owner/hanger. Run runway's apple-signing with create-developer-id."; exit 1; }
          # decrypt the private key (same scheme as runway's asc.py: SIGNING_KEY_PASSWORD, else sha256 of the .p8 text)
          python3 - "$src/devid.key.enc" "$dir/devid.key" <<'PY'
          import base64, hashlib, os, subprocess, sys
          src, dst = sys.argv[1], sys.argv[2]
          explicit = os.environ.get("SIGNING_KEY_PASSWORD", "")
          raw = os.environ["ASC_KEY_P8_BASE64"]
          pem = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode("".join(raw.split())).decode()
          pem = pem.replace("\r\n", "\n").strip() + "\n"
          crlf = pem.replace("\n", "\r\n")
          forms = [pem, pem.rstrip("\n"), raw, raw.strip(), raw.strip() + "\n", crlf, crlf.rstrip("\n"), crlf.rstrip("\r\n")]
          cands = [explicit] if explicit else list(dict.fromkeys(hashlib.sha256(s.encode()).hexdigest() for s in forms))
          for pw in cands:
              r = subprocess.run(["openssl", "enc", "-d", "-aes-256-cbc", "-pbkdf2", "-iter", "200000", "-in", src, "-out", dst,
                                  "-pass", "env:RW_PASS"], env=dict(os.environ, RW_PASS=pw), capture_output=True)
              if r.returncode == 0 and subprocess.run(["openssl", "pkey", "-in", dst, "-noout"], capture_output=True).returncode == 0:
                  sys.exit(0)
          print("::error::Could not decrypt the signing key (the .p8 may have changed; rerun runway's apple-signing).")
          sys.exit(1)
          PY
          openssl x509 -inform DER -in "$src/developer_id_application.cer" -out "$dir/devid.pem"
          identity=$(openssl x509 -in "$dir/devid.pem" -noout -subject -nameopt multiline | sed -n 's/^ *commonName *= *//p')
          case "$identity" in "Developer ID Application:"*) ;; *) echo "::error::Unexpected certificate: $identity"; exit 1 ;; esac
          p12pass="$(uuidgen)"
          openssl pkcs12 -export -inkey "$dir/devid.key" -in "$dir/devid.pem" -name devid -out "$dir/devid.p12" -passout "pass:$p12pass"
          echo "::add-mask::$p12pass"
          {
            echo "APPLE_CERTIFICATE=$(base64 < "$dir/devid.p12" | tr -d '\n')"
            echo "APPLE_CERTIFICATE_PASSWORD=$p12pass"
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_API_ISSUER=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
            echo "APPLE_API_KEY=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
            echo "APPLE_API_KEY_PATH=$(ls "$dir"/keys/*.p8)"
          } >> "$GITHUB_ENV"
          rm -rf "$dir/devid.key" "$dir/devid.p12" "$dir/hanger"
          echo "Signing as: $identity"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

      - name: Verify macOS signature
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/src-tauri/target -path '*bundle/macos/*.app' -maxdepth 6 | head -n 1)
          codesign --verify --strict --deep --verbose=2 "$app"
          spctl -a -vv -t exec "$app"
          xcrun stapler validate "$app"

      - name: Clean up
        if: always() && matrix.platform == 'macos-latest'
        run: rm -rf "$RUNNER_TEMP/sign"

  publish:
    needs: [desktop, npm]
    if: ${{ !cancelled() && (inputs.publish_only || (needs.desktop.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge duplicate drafts and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          rels=$(gh api "repos/$repo/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")] | sort_by(.id)")
          [ "$(jq length <<<"$rels")" -gt 0 ] || { echo "::error::No release for $TAG"; exit 1; }
          # keep the published one if there is one, else the oldest draft
          keep=$(jq -r '(map(select(.draft == false)) + .)[0].id' <<<"$rels")
          have=$(gh api "repos/$repo/releases/$keep/assets?per_page=100" --jq '.[].name')
          for dup in $(jq -r --argjson k "$keep" '.[] | select(.id != $k and .draft) | .id' <<<"$rels"); do
            dir=$(mktemp -d)
            for row in $(gh api "repos/$repo/releases/$dup/assets?per_page=100" --jq '.[] | "\(.id):\(.name)"'); do
              aid=${row%%:*}; name=${row#*:}
              if grep -qxF "$name" <<<"$have"; then continue; fi
              gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$aid" > "$dir/$name"
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
                --data-binary "@$dir/$name" "https://uploads.github.com/repos/$repo/releases/$keep/assets?name=$name" > /dev/null
              echo "moved $name from draft $dup"
            done
            gh api -X DELETE "repos/$repo/releases/$dup"
            echo "deleted duplicate draft $dup"
          done
          gh api -X PATCH "repos/$repo/releases/$keep" -F draft=false -f make_latest=true --jq '.html_url'
