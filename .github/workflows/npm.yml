# Publishes fresnel-icon (CLI) and fresnel-mcp (MCP server) to npm with provenance.
# Runs on version tags (v0.1.0 …) and by hand (Actions → npm → Run workflow, from the GitHub app too).
# Needs the NPM_TOKEN secret: an npm granular access token with read and write access to packages.
name: npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check versions match the tag
        run: |
          v="${TAG#v}"
          for p in packages/cli packages/mcp; do
            pv=$(node -p "require('./$p/package.json').version")
            [ "$pv" = "$v" ] || { echo "::error::$p is $pv but the tag is $TAG"; exit 1; }
          done
      - run: pnpm --filter fresnel-icon --filter fresnel-mcp run build
      - name: Smoke test the packed CLI and MCP server
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"; mkdir -p "$out"
          (cd packages/cli && pnpm pack --pack-destination "$out")
          (cd packages/mcp && pnpm pack --pack-destination "$out")
          cd "$(mktemp -d)" && npm init -y > /dev/null
          npm install "$out"/fresnel-icon-*.tgz "$out"/fresnel-mcp-*.tgz
          npx fresnel --version
          npx fresnel-mcp --version
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add it in Settings → Secrets and variables → Actions, then run this workflow again."; exit 1
          fi
          for p in packages/cli packages/mcp; do
            name=$(node -p "require('./$p/package.json').name"); v=$(node -p "require('./$p/package.json').version")
            if npm view "$name@$v" version > /dev/null 2>&1; then echo "$name@$v is already on npm"; continue; fi
            (cd "$p" && pnpm publish --access public --provenance --no-git-checks)
          done

